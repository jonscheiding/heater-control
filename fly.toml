# fly.toml app configuration file generated for heater-control on 2026-07-03T08:03:34-05:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'sm-oidc-proxy'
primary_region = 'ord'

[build]
  dockerfile = 'packages/oidc-proxy/Dockerfile'

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 1024
