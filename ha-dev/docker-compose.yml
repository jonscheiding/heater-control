name: heater-control-ha

# Local HA dev stack — a SINGLE self-provisioning service. The OIDC proxy runs
# on the HOST (so it's debuggable):
#
#   # one-time: let the browser resolve the proxy the way HA does
#   echo "127.0.0.1 oidc-proxy.test" | sudo tee -a /etc/hosts
#
#   # terminal A — the proxy, on the host (hot reload / debugger):
#   pnpm --filter @heater-control/oidc-proxy dev
#
#   # terminal B — Home Assistant:
#   cd ha-dev && docker compose up --build
#   open http://localhost:8123    # sign in dev/dev, or "ScheduleMaster (dev)"
#
# HA reaches the host proxy via extra_hosts (host-gateway) at the same name the
# browser uses, so the OIDC issuer is identical on both sides.

services:
  homeassistant:
    build:
      context: ..
      dockerfile: ha-dev/Dockerfile
    image: heater-control-ha:dev
    restart: unless-stopped
    ports:
      - "8123:8123"
    extra_hosts:
      - "oidc-proxy.test:host-gateway"
    environment:
      - TZ=America/Chicago
      - HC_AUTO_SETUP=1
      - OIDC_DISCOVERY_URL=${OIDC_DISCOVERY_URL:-http://oidc-proxy.test:3300/.well-known/openid-configuration}
      - OIDC_CLIENT_ID=home-assistant
      - OIDC_CLIENT_SECRET=${OIDC_CLIENT_SECRET:-dev-ha-secret}
      - OIDC_DISPLAY_NAME=ScheduleMaster
      - OIDC_FORCE_HTTPS=false
      - HA_CORS_ORIGINS=${HA_CORS_ORGINS:-http://localhost:5173,http://localhost:8123}
      - HA_ONBOARD_PASSWORD=${HA_ONBOARD_PASSWORD:-dev}
      # ScheduleMaster: unset by default (calendar.schedulemaster is created but
      # empty). Set SM_USERNAME/SM_PASSWORD in the environment to poll live.
      - SM_USERNAME=${SM_USERNAME:-}
      - SM_PASSWORD=${SM_PASSWORD:-}
      - SM_BASE_URL=${SM_BASE_URL:-}
      - SM_WARM_THRESHOLD_F=${SM_WARM_THRESHOLD_F:-}
      - SM_WEATHER_ENTITY=${SM_WEATHER_ENTITY:-}
      - SM_PREHEAT_LEAD=${SM_PREHEAT_LEAD:-}
      # Timezone of the ScheduleMaster wall-times; set when HA's own tz isn't the
      # club's local time (dev onboards HA as UTC).
      - SM_TIMEZONE=${SM_TIMEZONE:-}
      - PUID=${PUID:-}
      - PGID=${PGID:-}
    healthcheck:
      # /manifest.json is a static 200 whether or not HA is onboarded.
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8123/manifest.json')",
        ]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 20s
    volumes:
      # Runtime state (DB, logs, .storage, provisioned components, generated
      # packages, rendered includes) — gitignored. The entrypoint stages config
      # into /config from /opt/provision; bind-mount the sources over that so a
      # `docker compose restart` picks up roster/blueprint edits without a rebuild.
      - ./.dev/config:/config
      - ../homeassistant/heaters.demo.json:/opt/provision/heaters.demo.json:ro
      - ../homeassistant/gen_packages.py:/opt/provision/gen_packages.py:ro
      - ../homeassistant/packages/scheduling.yaml:/opt/provision/packages/scheduling.yaml:ro
      - ../homeassistant/blueprints:/opt/provision/blueprints:ro
      # Custom component sources: mount the schedulemaster subdir only (mounting
      # the whole custom_components dir would hide the image-baked auth_oidc).
      # `docker compose restart` restages it. Add a line per new component.
      - ../homeassistant/custom_components/schedulemaster:/opt/provision/custom_components/schedulemaster:ro
