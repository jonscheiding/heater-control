# fly.toml app configuration file generated for heater-control-ha-dev on 2026-07-20T21:14:34Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'heater-control-ha-dev'
primary_region = 'ord'

[build]
  dockerfile = 'ha-dev/Dockerfile'

[env]
  HA_CORS_ORIGINS = 'http://localhost:5173'
  HA_TRUSTED_PROXIES = '127.0.0.1/32,::1,172.16.0.0/12,fdaa::/16'
  HA_USE_X_FORWARDED_FOR = 'true'
  HC_AUTO_SETUP = '1'
  HC_STAGE_CONFIG = '1'
  OIDC_CLIENT_ID = 'home-assistant'
  OIDC_DISCOVERY_URL = 'https://sm-oidc-proxy.fly.dev/.well-known/openid-configuration'
  OIDC_DISPLAY_NAME = 'ScheduleMaster'
  OIDC_FORCE_HTTPS = 'true'
  TZ = 'America/Chicago'

[http_service]
  internal_port = 8123
  force_https = true
  auto_stop_machines = 'suspend'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

  [[http_service.checks]]
    interval = '15s'
    timeout = '5s'
    grace_period = '2m0s'
    method = 'GET'
    path = '/manifest.json'

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 1024
