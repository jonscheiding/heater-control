# fly.toml app configuration file generated for heater-control-ha-dev on 2026-07-20T17:16:54-04:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'heater-control-ha-dev'
primary_region = 'ord'

[build]
  dockerfile = 'Dockerfile'

[env]
  HA_CORS_ORIGINS = 'http://localhost:5173'
  # Trust all proxies: on Fly the internal_port is reachable ONLY via fly-proxy,
  # whose (IPv6/mapped) peer IP is hard to pin. Without this HA 400s every proxied
  # request ("X-Forwarded-For header from an untrusted proxy") and bounces you to
  # login on each refresh. Only affects IP-based features; auth is still required.
  HA_TRUSTED_PROXIES = '0.0.0.0/0,::/0'
  HA_USE_X_FORWARDED_FOR = 'true'
  HC_AUTO_SETUP = '1'
  HC_STAGE_CONFIG = '1'
  OIDC_CLIENT_ID = 'home-assistant'
  OIDC_DISCOVERY_URL = 'https://sm-oidc-proxy.fly.dev/.well-known/openid-configuration'
  OIDC_DISPLAY_NAME = 'ScheduleMaster'
  OIDC_FORCE_HTTPS = 'true'
  TZ = 'America/Chicago'

# Persist /config so onboarding + the local calendar survive stop/suspend/redeploy
# (no "create your smart home" flash on cold wake). Still scales to zero — the
# volume is independent of the machine stopping. `fly deploy` auto-creates it at
# initial_size for the first machine; or run `fly volume create ha_config`.
[mounts]
  source = 'ha_config'
  destination = '/config'
  initial_size = '1gb'

[http_service]
  internal_port = 8123
  force_https = true
  auto_stop_machines = 'suspend'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

  [[http_service.checks]]
    interval = '15s'
    timeout = '5s'
    grace_period = '4m0s'   # HA cold boot is slow; give it room before failing
    method = 'GET'
    # Probe an auth_oidc route (not /manifest.json). auth_oidc registers its
    # provider + this route a few seconds AFTER HA's login page starts serving;
    # gating "healthy" on it means fly-proxy holds the cold-wake request until the
    # SSO provider is ready, so the "Log in with ScheduleMaster" button is present
    # on first load instead of only after a reload. Trade-off: if auth_oidc fails
    # to set up, the machine reads as unhealthy (fine here — OIDC is the point).
    path = '/auth/oidc/welcome'

[[vm]]
  memory = '2gb'            # HA + recorder; boots faster with headroom
  cpu_kind = 'shared'
  cpus = 2
  memory_mb = 2048
