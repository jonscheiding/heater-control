name: Build and test

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm format

      - run: pnpm build

      - run: pnpm lint

      - run: pnpm test

      - run: pnpm -r test:smoke

      # Offline unit tests for the schedulemaster HA custom component (pure
      # parsing + projection logic; no HA/network needed).
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - run: pip install pytest

      - run: pytest homeassistant/tests -q
