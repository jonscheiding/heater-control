input_boolean:
  heater_3:
    name: "Heater 3"
    icon: mdi:radiator

timer:
  heater_3_autooff:
    duration: "02:00:00"
    restore: true

automation:
  - alias: "Heater 3: auto-off wiring"
    use_blueprint:
      path: heater_control/switch_with_auto_off.yaml
      input:
        switch: input_boolean.heater_3
        autooff_timer: timer.heater_3_autooff

# --- POC-only: fake power metering ------------------------------------
# When you swap input_boolean.heater_3 for a real switch.heater_3 from a
# Z-Wave / Zigbee / WiFi metering integration, delete this whole section.
# The real switch's integration will create its own sensor.heater_3_power.

input_number:
  heater_3_simulated_watts:
    name: "Heater 3 simulated wattage"
    min: 0
    max: 2000
    step: 100
    initial: 1200
    unit_of_measurement: "W"
    icon: mdi:flash

template:
  - sensor:
      - name: "Heater 3 power"
        unique_id: heater_3_power
        unit_of_measurement: "W"
        device_class: power
        state: >
          {% if is_state('input_boolean.heater_3', 'on') %}
            {{ states('input_number.heater_3_simulated_watts') | float(0) }}
          {% else %}
            0
          {% endif %}
