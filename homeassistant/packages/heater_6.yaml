input_boolean:
  heater_6:
    name: "C172 N2FN"
    icon: mdi:radiator

timer:
  heater_6_autooff:
    duration: "02:00:00"
    restore: true

automation:
  - alias: "C172 N2FN: auto-off wiring"
    use_blueprint:
      path: heater_control/switch_with_auto_off.yaml
      input:
        switch: input_boolean.heater_6
        autooff_timer: timer.heater_6_autooff

# --- POC-only: fake power metering ------------------------------------
# When you swap input_boolean.heater_6 for a real switch.heater_6 from a
# Z-Wave / Zigbee / WiFi metering integration, delete this whole section.
# The real switch's integration will create its own sensor.heater_6_power.

input_number:
  heater_6_simulated_watts:
    name: "C172 N2FN simulated wattage"
    min: 0
    max: 2000
    step: 100
    initial: 1200
    unit_of_measurement: "W"
    icon: mdi:flash

template:
  - sensor:
      - name: "C172 N2FN power"
        unique_id: heater_6_power
        unit_of_measurement: "W"
        device_class: power
        state: >
          {% if is_state('input_boolean.heater_6', 'on') %}
            {{ states('input_number.heater_6_simulated_watts') | float(0) }}
          {% else %}
            0
          {% endif %}
