input_boolean:
  heater_5:
    name: "C206 N206FN"
    icon: mdi:radiator

timer:
  heater_5_autooff:
    duration: "02:00:00"
    restore: true

automation:
  - alias: "C206 N206FN: auto-off wiring"
    use_blueprint:
      path: heater_control/switch_with_auto_off.yaml
      input:
        switch: input_boolean.heater_5
        autooff_timer: timer.heater_5_autooff

# --- POC-only: fake power metering ------------------------------------
# When you swap input_boolean.heater_5 for a real switch.heater_5 from a
# Z-Wave / Zigbee / WiFi metering integration, delete this whole section.
# The real switch's integration will create its own sensor.heater_5_power.

input_number:
  heater_5_simulated_watts:
    name: "C206 N206FN simulated wattage"
    min: 0
    max: 2000
    step: 100
    initial: 1200
    unit_of_measurement: "W"
    icon: mdi:flash

template:
  - sensor:
      - name: "C206 N206FN power"
        unique_id: heater_5_power
        unit_of_measurement: "W"
        device_class: power
        state: >
          {% if is_state('input_boolean.heater_5', 'on') %}
            {{ states('input_number.heater_5_simulated_watts') | float(0) }}
          {% else %}
            0
          {% endif %}
