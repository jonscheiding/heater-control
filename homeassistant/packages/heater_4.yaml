input_boolean:
  heater_4:
    name: "C182 N9525D"
    icon: mdi:radiator

timer:
  heater_4_autooff:
    duration: "02:00:00"
    restore: true

automation:
  - alias: "C182 N9525D: auto-off wiring"
    use_blueprint:
      path: heater_control/switch_with_auto_off.yaml
      input:
        switch: input_boolean.heater_4
        autooff_timer: timer.heater_4_autooff

# --- POC-only: fake power metering ------------------------------------
# When you swap input_boolean.heater_4 for a real switch.heater_4 from a
# Z-Wave / Zigbee / WiFi metering integration, delete this whole section.
# The real switch's integration will create its own sensor.heater_4_power.

input_number:
  heater_4_simulated_watts:
    name: "C182 N9525D simulated wattage"
    min: 0
    max: 2000
    step: 100
    initial: 1200
    unit_of_measurement: "W"
    icon: mdi:flash

template:
  - sensor:
      - name: "C182 N9525D power"
        unique_id: heater_4_power
        unit_of_measurement: "W"
        device_class: power
        state: >
          {% if is_state('input_boolean.heater_4', 'on') %}
            {{ states('input_number.heater_4_simulated_watts') | float(0) }}
          {% else %}
            0
          {% endif %}
