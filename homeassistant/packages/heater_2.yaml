input_boolean:
  heater_2:
    name: "Heater 2"
    icon: mdi:radiator

timer:
  heater_2_autooff:
    duration: "02:00:00"
    restore: true

automation:
  - alias: "Heater 2: auto-off wiring"
    use_blueprint:
      path: heater_control/switch_with_auto_off.yaml
      input:
        switch: input_boolean.heater_2
        autooff_timer: timer.heater_2_autooff

# --- POC-only: fake power metering ------------------------------------
# When you swap input_boolean.heater_2 for a real switch.heater_2 from a
# Z-Wave / Zigbee / WiFi metering integration, delete this whole section.
# The real switch's integration will create its own sensor.heater_2_power.

input_number:
  heater_2_simulated_watts:
    name: "Heater 2 simulated wattage"
    min: 0
    max: 2000
    step: 100
    initial: 0
    unit_of_measurement: "W"
    icon: mdi:flash

template:
  - sensor:
      - name: "Heater 2 power"
        unique_id: heater_2_power
        unit_of_measurement: "W"
        device_class: power
        state: >
          {% if is_state('input_boolean.heater_2', 'on') %}
            {{ states('input_number.heater_2_simulated_watts') | float(0) }}
          {% else %}
            0
          {% endif %}
