# Home Assistant reference configuration for the heater-control stack.
#
# Environment-specific settings (OIDC issuer, CORS, trusted proxies) are NOT
# hardcoded here — they are rendered at container start into http.yaml and
# auth_oidc.yaml from environment variables (see ha-dev/render_config.py), so the
# same config serves local dev (host proxy over http) and the Fly demo (proxy
# over https). On a plain HAOS box, create those two files by hand.
#
# We deliberately do NOT use `default_config:` — it pulls in a lot of network
# discovery + cloud/mobile integrations (ssdp, zeroconf, dhcp, usb, bluetooth,
# cloud, mobile_app, …) that are useless here and slow HA's boot. Instead we
# enable just what this app needs, which cuts cold-boot time substantially.

# Core UI, API, and first-run flow.
frontend:
config:
api:
websocket_api:
onboarding:
analytics:
system_health:
sun:
cloud:

http: !include http.yaml

# Automations / scenes / scripts.
automation:
scene:
script:

# History + logbook (pull in the recorder; its SQLite DB persists on the volume).
history:
logbook:

# Helpers used by the per-heater packages.
input_boolean:
input_number:
input_datetime:
timer:
template:
person:

# Per-heater packages: each bundles its input_boolean/timer/auto-off automation.
# us_customary so weather temperatures come back in °F over the websocket API
# (the unit system is what governs the unit; there's no per-request override).
homeassistant:
  unit_system: us_customary
  packages: !include_dir_named packages

# OIDC login (auth_oidc) — adds an SSO option to HA's login screen.
auth_oidc: !include auth_oidc.yaml

logger:
  default: info
  logs:
    custom_components.auth_oidc: debug
