# Home Assistant reference configuration for the heater-control stack.
#
# Environment-specific settings (OIDC issuer, ScheduleMaster account) are NOT
# hardcoded here — they are rendered at container start into auth_oidc.yaml and
# schedulemaster.yaml from environment variables (see ha-dev/render_config.py),
# so the same config serves local dev (host proxy over http) and the Fly demo
# (proxy over https). On a plain HAOS box, create those files by hand.
#
# We deliberately do NOT use `default_config:` — it pulls in a lot of network
# discovery + cloud/mobile integrations (ssdp, zeroconf, dhcp, usb, bluetooth,
# cloud, mobile_app, …) that are useless here and slow HA's boot. Instead we
# enable just what this app needs, which cuts cold-boot time substantially.

# Core UI, API, and first-run flow.
frontend:
config:
api:
websocket_api:
onboarding:
analytics:
system_health:
sun:
cloud:

# Automations / scenes / scripts.
automation:
scene:
script:

# History + logbook (pull in the recorder; its SQLite DB persists on the volume).
history:
logbook:

template:
person:

# Packages: the calendar-triggered turn-on automation, plus the Fly keepalive.
# Heaters themselves are config entries owned by the heater_control integration,
# not YAML.
# us_customary so weather temperatures come back in °F over the websocket API
# (the unit system is what governs the unit; there's no per-request override).
homeassistant:
  unit_system: us_customary
  packages: !include_dir_named packages

# OIDC login (auth_oidc) — adds an SSO option to HA's login screen.
auth_oidc: !include auth_oidc.yaml

# ScheduleMaster integration — auto-preheats from flight bookings and exposes
# calendar.schedulemaster (empty until account credentials are provided). Like
# the two includes above, schedulemaster.yaml is rendered from env at container
# start (ha-dev/render_config.py); on a prod HAOS box create it by hand with the
# ScheduleMaster username/password.
schedulemaster: !include schedulemaster.yaml

# Heaters. On the prod box these are config entries added in the UI and this
# include is absent; dev and the Fly demo can't click through a config flow (and
# wipe .storage on reset), so the container renders a declarative roster that the
# integration reconciles into config entries at every start.
heater_control: !include heater_control.yaml

logger:
  default: info
  logs:
    custom_components.auth_oidc: debug
    custom_components.schedulemaster: info
    custom_components.heater_control: info
