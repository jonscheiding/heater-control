# Example: point HA's auth_oidc (hass-oidc-auth) at the ScheduleMaster OIDC proxy.
#
# Merge this into configuration.yaml. The proxy replaces the temporary Google
# issuer from the POC. Values must match the proxy's env (OIDC_ISSUER,
# HA_CLIENT_ID, HA_CLIENT_SECRET, HA_REDIRECT_URIS).
#
# NOTE: hass-oidc-auth's config keys have shifted between releases — treat this
# as a template and reconcile against the integration's current README:
# https://github.com/christiaangoossens/hass-oidc-auth

auth_oidc:
  client_id: home-assistant
  client_secret: !secret sm_oidc_client_secret
  discovery_url: "https://sm-oidc.example.com/.well-known/openid-configuration"

  # Claim mapping — the proxy issues these from the ScheduleMaster profile.
  claims:
    display_name: "name"
    username: "preferred_username"

  features:
    # No authorization model — any ScheduleMaster user may sign in.
    automatic_user_linking: true
    automatic_person_creation: true
