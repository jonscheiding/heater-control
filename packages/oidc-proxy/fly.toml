# fly.toml app configuration file generated for sm-oidc-proxy on 2026-07-03T13:31:14Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'sm-oidc-proxy'
primary_region = 'ord'

[http_service]
  auto_start_machines = true
  auto_stop_machines = 'stop'
  force_https = true
  internal_port = 3000
  min_machines_running = 0
  processes = ['app']

[[vm]]
  cpu_kind = 'shared'
  cpus = 1
  memory = '1gb'
  memory_mb = 1024
